    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      if (window.location.hostname.includes('netlify.app')) {
        window.location.replace('https://homefy-servicios.vercel.app' + window.location.pathname + window.location.search + window.location.hash);
      }
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
      try {
        var savedMode = localStorage.getItem('theme_mode');
        if (!savedMode) {
          var legacyDark = localStorage.getItem('darkMode');
          if (legacyDark !== null) {
            savedMode = JSON.parse(legacyDark) ? 'dark' : 'light';
          } else {
            savedMode = 'light'; // Predeterminado al descargar / abrir de cero: Modo Claro
          }
        }

        var isDark = false;
        if (savedMode === 'dark') {
          isDark = true;
        } else if (savedMode === 'system') {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          isDark = false; // 'light'
        }

        var root = document.documentElement;
        root.style.colorScheme = isDark ? 'dark' : 'light';
        if (isDark) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        // 1. Sincronizar meta color-scheme
        var colorSchemeMeta = document.getElementById('color-scheme-meta') || document.querySelector('meta[name="color-scheme"]');
        if (colorSchemeMeta) {
          colorSchemeMeta.setAttribute('content', isDark ? 'dark' : 'light');
        }

        // 2. Color idéntico al HeaderMobile: #f8fafc (bg-slate-50) en claro, #0f172a (bg-slate-900) en oscuro
        var targetColor = isDark ? '#0f172a' : '#f8fafc';
        var themeColorMetas = document.querySelectorAll('meta[name="theme-color"]');
        if (themeColorMetas.length > 0) {
          themeColorMetas.forEach(function(m) {
            m.setAttribute('content', targetColor);
            m.content = targetColor;
          });
        }

        // 3. iOS status bar
        var appleMeta = document.getElementById('apple-status-bar-meta');
        if (appleMeta) {
          appleMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
        }
      } catch (e) {}
    </script>
