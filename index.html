<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" id="color-scheme-meta" />
    <meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-meta" />
    <meta name="apple-mobile-web-app-title" content="Home - Servicios" />
    <script>
      if (window.location.hostname.includes('netlify.app')) {
        window.location.replace('https://app-servicios-olive.vercel.app' + window.location.pathname + window.location.search + window.location.hash);
      }
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
      try {
        var savedMode = localStorage.getItem('theme_mode');
        if (!savedMode) {
          var legacyDark = localStorage.getItem('darkMode');
          if (legacyDark !== null) {
            savedMode = JSON.parse(legacyDark) ? 'dark' : 'light';
          } else {
            savedMode = 'light'; // Predeterminado al descargar / abrir de cero: Modo Claro
          }
        }

        var isDark = false;
        if (savedMode === 'dark') {
          isDark = true;
        } else if (savedMode === 'system') {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          isDark = false; // 'light'
        }

        var root = document.documentElement;
        root.style.colorScheme = isDark ? 'dark' : 'light';
        if (isDark) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        // 1. Sincronizar meta color-scheme
        var colorSchemeMeta = document.getElementById('color-scheme-meta') || document.querySelector('meta[name="color-scheme"]');
        if (colorSchemeMeta) {
          colorSchemeMeta.setAttribute('content', isDark ? 'dark' : 'light');
        }

        // 2. Color idéntico al HeaderMobile: #f8fafc (bg-slate-50) en claro, #0f172a (bg-slate-900) en oscuro
        var targetColor = isDark ? '#0f172a' : '#f8fafc';
        var themeColorMetas = document.querySelectorAll('meta[name="theme-color"]');
        if (themeColorMetas.length > 0) {
          themeColorMetas.forEach(function(m) {
            m.setAttribute('content', targetColor);
            m.content = targetColor;
          });
        } else {
          var newMeta = document.createElement('meta');
          newMeta.name = 'theme-color';
          newMeta.id = 'theme-color-meta';
          newMeta.content = targetColor;
          newMeta.setAttribute('content', targetColor);
          document.head.appendChild(newMeta);
        }

        // 3. iOS status bar
        var appleMeta = document.getElementById('apple-status-bar-meta');
        if (appleMeta) {
          appleMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
        }
      } catch (e) {}
    </script>
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <title>Home - Servicios</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
